name: Approve repository owner pull requests

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    if: >-
      github.event.pull_request.user.login == 'TheLeftMoose' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Approve owner pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f event=APPROVE \
            -f body="Automatically approved because the pull request author is the repository owner."
